# Verifica tipos, tests unitarios y pruebas E2E en cada push o pull request a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Solo permiso de lectura: este workflow no necesita modificar nada del repositorio
permissions:
  contents: read

# Si subís dos commits seguidos, cancela la verificación vieja y corre solo la nueva
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma necesita una URL para generar el cliente; los tests unitarios no se conectan a ninguna base
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar pnpm (la versión del campo packageManager)
        uses: pnpm/action-setup@v4

      - name: Instalar Node (la versión de .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm --filter @tienda-alpi/api exec prisma generate

      - name: Verificar tipos y correr tests
        run: pnpm verificar

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    services:
      # PostgreSQL temporal: existe solo durante esta ejecución (la contraseña no protege nada real)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alpi
          POSTGRES_PASSWORD: alpi_ci
          POSTGRES_DB: tienda_alpi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alpi:alpi_ci@localhost:5432/tienda_alpi_e2e?schema=public
      DATABASE_URL_E2E: postgresql://alpi:alpi_ci@localhost:5432/tienda_alpi_e2e?schema=public
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm --filter @tienda-alpi/api exec prisma generate

      - name: Compilar el paquete de precios
        run: pnpm build:precios

      - name: Instalar Chromium
        run: pnpm --filter @tienda-alpi/e2e exec playwright install --with-deps chromium

      - name: Correr las pruebas E2E
        run: pnpm e2e

      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: apps/e2e/playwright-report/
          retention-days: 7
